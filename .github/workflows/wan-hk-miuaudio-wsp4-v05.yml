name: Wan HK MiuAudio WSP4 v05
run-name: 'MiuAudio WSP4 v05 | ${{ inputs.mode }} | ${{ inputs.confirmation }}'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: One MiuAudio WSP4 30-second 720P commercial with music added in post; one POST maximum
        required: true
        default: offline-validate
        type: choice
        options: [offline-validate, check-binding, generate, resume]
      confirmation:
        description: Exact scoped dispatch identity
        type: string
      prompt:
        description: Exact private prompt; hash checked, never printed
        type: string
      image_1_base64:
        description: Pinned product identity WebP; event only, never printed
        type: string
      image_2_base64:
        description: Pinned listener/world before transformation WebP; event only, never printed
        type: string
      image_3_base64:
        description: Pinned listener/world after transformation WebP; event only, never printed
        type: string
      expected_sha:
        description: Exact independently verified source commit
        type: string
      resume_task_id:
        description: Existing MiuAudio provider UUID from original receipt; GET-only
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: wan-hk-miuaudio-wsp4-v05-one-paid-post
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: tools/wan-hk/miuaudio-wsp4-v05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate exact package offline
        run: python3 miuaudio_wsp4_v05_runner.py --mode offline-validate
      - name: Ensure result validation tools on ephemeral runner
        if: ${{ inputs.mode == 'generate' || inputs.mode == 'resume' }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Run exact operation through existing Wan HK binding
        if: ${{ inputs.mode != 'offline-validate' }}
        env:
          ALIYUN_MODEL_STUDIO_HK_API_KEY: ${{ secrets.ALIYUN_MODEL_STUDIO_HK_API_KEY }}
          ALIYUN_MODEL_STUDIO_HK_API_HOST: ${{ vars.ALIYUN_MODEL_STUDIO_HK_API_HOST }}
          GITHUB_TOKEN: ${{ github.token }}
          WAN_OPERATION: ${{ inputs.mode }}
        run: python3 miuaudio_wsp4_v05_runner.py --mode "$WAN_OPERATION"
      - name: Preserve sanitized receipt and completed result
        if: ${{ always() && hashFiles('tools/wan-hk/miuaudio-wsp4-v05/output-miuaudio-wsp4-v05/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: miuaudio-wsp4-v05-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: tools/wan-hk/miuaudio-wsp4-v05/output-miuaudio-wsp4-v05/
          retention-days: 2
          if-no-files-found: error
