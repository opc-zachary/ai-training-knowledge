# APPROVED_BATCH_HKD15_MAX_THREE_POSTS_B_FIRST_NO_PAID_RETRY
name: Wan HK Starbay three-character v01 approved

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation; check-binding makes zero provider API calls
        required: true
        default: check-binding
        type: choice
        options:
          - check-binding
          - generate
          - resume
          - validate-existing
      segment:
        description: Exact segment; run B and review it before A or C
        required: true
        default: B
        type: choice
        options:
          - B
          - A
          - C
      confirmation:
        description: For generate only, enter the exact segment confirmation from the pinned contract
        required: false
        type: string
      b_review_gate:
        description: For A or C only after B passes review, enter B_REVIEWED_USABLE_CONTINUE_APPROVED_BATCH
        required: false
        type: string
      image_1_base64:
        description: Exact contract-pinned WebP Image 1 as raw base64; never source photo or data-URI prefix
        required: false
        type: string
      image_2_base64:
        description: B only; exact contract-pinned WebP Image 2 as raw base64
        required: false
        type: string
      resume_task_id:
        description: Existing task UUID for the selected segment; resume is provider GET-only
        required: false
        type: string
      existing_output_path:
        description: Path relative to tools/wan-hk for validate-existing only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wan-hk-starbay-three-character-v01-paid-generation
  cancel-in-progress: false

jobs:
  execute-one-segment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: tools/wan-hk
    steps:
      - name: Check out pinned executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure ffprobe and ffmpeg are available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          command -v ffprobe >/dev/null 2>&1
          command -v ffmpeg >/dev/null 2>&1

      - name: Run pinned one-segment operation
        env:
          ALIYUN_MODEL_STUDIO_HK_API_KEY: ${{ secrets.ALIYUN_MODEL_STUDIO_HK_API_KEY }}
          ALIYUN_MODEL_STUDIO_HK_API_HOST: ${{ vars.ALIYUN_MODEL_STUDIO_HK_API_HOST }}
          WAN_OPERATION: ${{ inputs.mode }}
          WAN_SEGMENT: ${{ inputs.segment }}
          WAN_GENERATE_CONFIRMATION: ${{ inputs.confirmation }}
          WAN_B_REVIEW_GATE: ${{ inputs.b_review_gate }}
          WAN_RESUME_TASK_ID: ${{ inputs.resume_task_id }}
          WAN_EXISTING_OUTPUT_PATH: ${{ inputs.existing_output_path }}
        run: |
          if [[ "$WAN_OPERATION" == "validate-existing" ]]; then
            [[ -n "$WAN_EXISTING_OUTPUT_PATH" ]] || {
              echo "ERROR VERIFY_OUTPUT_PATH_REQUIRED" >&2
              exit 1
            }
            python3 starbay_three_character_v01_runner.py \
              --mode validate-existing \
              --segment "$WAN_SEGMENT" \
              --verify-output "$WAN_EXISTING_OUTPUT_PATH"
          else
            python3 starbay_three_character_v01_runner.py \
              --mode "$WAN_OPERATION" \
              --segment "$WAN_SEGMENT" \
              --output-dir "output-starbay-three-character-v01/$WAN_SEGMENT"
          fi

      - name: Validate downloaded result when present
        if: ${{ always() && inputs.mode != 'validate-existing' }}
        env:
          WAN_SEGMENT: ${{ inputs.segment }}
        run: |
          shopt -s nullglob
          videos=("output-starbay-three-character-v01/$WAN_SEGMENT"/*.mp4)
          if (( ${#videos[@]} == 0 )); then
            echo "No MP4 was downloaded; receipt-only or preflight run."
          elif (( ${#videos[@]} != 1 )); then
            echo "ERROR UNEXPECTED_MP4_COUNT" >&2
            exit 1
          else
            python3 starbay_three_character_v01_runner.py \
              --mode validate-existing \
              --segment "$WAN_SEGMENT" \
              --verify-output "${videos[0]}"
          fi

      - name: Upload short-lived sanitized receipt and result
        if: ${{ always() && hashFiles(format('tools/wan-hk/output-starbay-three-character-v01/{0}/**', inputs.segment)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wan-hk-starbay-three-character-v01-${{ inputs.segment }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: tools/wan-hk/output-starbay-three-character-v01/${{ inputs.segment }}/
          if-no-files-found: error
          retention-days: 2
